<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">MCP vs CLI cover</title>
  <desc id="desc">A dark agentic-futurist diagram comparing MCP servers and command line tools.</desc>
  <defs>
    <radialGradient id="cyanGlow" cx="18%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="86%" cy="88%" r="65%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.28"/>
      <stop offset="58%" stop-color="#d946ef" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#05060a"/>
  <rect width="1200" height="800" fill="url(#cyanGlow)"/>
  <rect width="1200" height="800" fill="url(#magentaGlow)"/>
  <rect width="1200" height="800" fill="url(#grid)" opacity="0.8"/>

  <g transform="translate(80 86)">
    <text x="0" y="0" fill="#67e8f9" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" letter-spacing="6">AI TOOLING DECISION MAP</text>
    <text x="0" y="94" fill="#f4f6fb" font-family="Manrope, system-ui, sans-serif" font-size="86" font-weight="750">MCP vs CLI</text>
    <text x="3" y="145" fill="#aab2c2" font-family="Source Serif 4, Georgia, serif" font-size="30">When to expose a protocol, when to run a command.</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="82" y="300" width="318" height="260" rx="30" fill="#07111a" stroke="#22d3ee" stroke-opacity="0.34"/>
    <rect x="800" y="300" width="318" height="260" rx="30" fill="#140c1a" stroke="#d946ef" stroke-opacity="0.34"/>
    <rect x="464" y="360" width="272" height="140" rx="28" fill="#0b0d14" stroke="#ffffff" stroke-opacity="0.1"/>
  </g>

  <g font-family="JetBrains Mono, ui-monospace, monospace">
    <text x="122" y="350" fill="#67e8f9" font-size="18" letter-spacing="4">MCP SERVER</text>
    <text x="122" y="394" fill="#f4f6fb" font-size="25">Custom tools</text>
    <text x="122" y="432" fill="#c8d3e6" font-size="21">OAuth, scopes,</text>
    <text x="122" y="464" fill="#c8d3e6" font-size="21">lean JSON calls</text>

    <text x="840" y="350" fill="#f0abfc" font-size="18" letter-spacing="4">CLI</text>
    <text x="840" y="394" fill="#f4f6fb" font-size="25">Known syntax</text>
    <text x="840" y="432" fill="#c8d3e6" font-size="21">git, gh, docker,</text>
    <text x="840" y="464" fill="#c8d3e6" font-size="21">kubectl, psql</text>

    <text x="512" y="414" fill="#f4f6fb" font-size="24">Agent</text>
    <text x="504" y="452" fill="#8b94a6" font-size="17">chooses path</text>
  </g>

  <path d="M400 430H464" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <path d="M736 430H800" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="600" cy="430" r="8" fill="#22d3ee"/>
  <circle cx="600" cy="430" r="18" fill="none" stroke="#22d3ee" stroke-opacity="0.25"/>

  <g transform="translate(82 628)" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18">
    <rect width="1036" height="74" rx="24" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="34" y="46" fill="#e6f0ff">Famous tool? Use CLI.</text>
    <text x="374" y="46" fill="#67e8f9">Third-party client?</text>
    <text x="646" y="46" fill="#e6f0ff">Expose via MCP.</text>
  </g>
</svg>
