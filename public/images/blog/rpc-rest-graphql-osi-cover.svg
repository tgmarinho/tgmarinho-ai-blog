<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">REST, GraphQL and RPC over one HTTP transport</title>
  <desc id="desc">A dark agentic-futurist diagram: REST, GraphQL and RPC funnel into a single HTTP pipe at OSI layer 7.</desc>
  <defs>
    <radialGradient id="cyanGlow" cx="14%" cy="6%" r="72%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="88%" cy="92%" r="68%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#d946ef" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#05060a"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#magentaGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.8"/>

  <g transform="translate(80 78)">
    <text x="0" y="0" fill="#67e8f9" font-family="JetBrains Mono, ui-monospace, monospace" font-size="17" letter-spacing="6">FULLSTACK TYPESCRIPT · OSI LAYER 7</text>
    <text x="0" y="80" fill="#f4f6fb" font-family="Manrope, system-ui, sans-serif" font-size="68" font-weight="750">Same remote call,</text>
    <text x="0" y="150" fill="#f4f6fb" font-family="Manrope, system-ui, sans-serif" font-size="68" font-weight="750">different interface</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="80" y="298" width="300" height="118" rx="26" fill="#07111a" stroke="#22d3ee" stroke-opacity="0.34"/>
    <rect x="80" y="436" width="300" height="118" rx="26" fill="#0b0d14" stroke="#818cf8" stroke-opacity="0.34"/>
    <rect x="80" y="574" width="300" height="0" rx="26" fill="#140c1a" stroke="#d946ef" stroke-opacity="0.0"/>
  </g>

  <g font-family="JetBrains Mono, ui-monospace, monospace">
    <text x="112" y="344" fill="#67e8f9" font-size="17" letter-spacing="4">REST</text>
    <text x="112" y="386" fill="#c8d3e6" font-size="21">POST /orders</text>

    <text x="112" y="482" fill="#a5b4fc" font-size="17" letter-spacing="4">GRAPHQL</text>
    <text x="112" y="524" fill="#c8d3e6" font-size="21">{ order { id } }</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="820" y="367" width="300" height="118" rx="26" fill="#140c1a" stroke="#d946ef" stroke-opacity="0.34"/>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, monospace">
    <text x="852" y="413" fill="#f0abfc" font-size="17" letter-spacing="4">RPC / tRPC</text>
    <text x="852" y="455" fill="#c8d3e6" font-size="21">order.create()</text>
  </g>

  <path d="M380 357H470 a18 18 0 0 1 18 18 V407 a18 18 0 0 0 18 18 H560" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M380 495H470 a18 18 0 0 0 18 -18 V443 a18 18 0 0 1 18 -18 H560" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M820 426H700 a18 18 0 0 1 -18 18 V407 a18 18 0 0 0 -18 -18 H600" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" transform="translate(0 0)"/>

  <g filter="url(#softShadow)">
    <rect x="476" y="384" width="168" height="84" rx="22" fill="#0b0d14" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, monospace" text-anchor="middle">
    <text x="560" y="422" fill="#f4f6fb" font-size="26" letter-spacing="2">HTTP</text>
    <text x="560" y="448" fill="#8b94a6" font-size="15">one transport</text>
  </g>

  <g transform="translate(80 588)" font-family="JetBrains Mono, ui-monospace, monospace" font-size="17">
    <text x="0" y="0" fill="#aab2c2">The abstraction only hides the fetch. Underneath, it is always HTTP.</text>
  </g>
</svg>
