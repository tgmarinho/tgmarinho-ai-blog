<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">REST, GraphQL and RPC over one HTTP transport</title>
  <desc id="desc">A dark agentic-futurist diagram: three interface nodes (REST as a resource stack, GraphQL as a graph, RPC as a function call) converge into a single HTTP hub and continue to the server, with no embedded text.</desc>
  <defs>
    <radialGradient id="cyanGlow" cx="14%" cy="6%" r="72%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="88%" cy="92%" r="68%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#d946ef" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#05060a"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#magentaGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.8"/>

  <!-- connecting lines: three nodes -> hub -> server -->
  <g fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" opacity="0.92">
    <path d="M250 175 C 360 175, 420 280, 512 300"/>
    <path d="M250 315 C 360 315, 420 315, 508 315"/>
    <path d="M250 455 C 360 455, 420 350, 512 330"/>
    <path d="M692 315 H 904"/>
  </g>
  <!-- packet dots riding the transport -->
  <g fill="#e9d5ff">
    <circle cx="760" cy="315" r="4.5"/>
    <circle cx="828" cy="315" r="4.5" opacity="0.7"/>
    <circle cx="896" cy="315" r="4.5" opacity="0.45"/>
  </g>

  <!-- ===== REST node: resource stack ===== -->
  <g filter="url(#softShadow)">
    <circle cx="190" cy="175" r="60" fill="#07111a" stroke="#22d3ee" stroke-opacity="0.45"/>
  </g>
  <g stroke="#67e8f9" stroke-opacity="0.95">
    <rect x="160" y="151" width="60" height="13" rx="6.5" fill="#22d3ee" fill-opacity="0.16"/>
    <rect x="160" y="169" width="60" height="13" rx="6.5" fill="#22d3ee" fill-opacity="0.16"/>
    <rect x="160" y="187" width="60" height="13" rx="6.5" fill="#22d3ee" fill-opacity="0.16"/>
  </g>

  <!-- ===== GraphQL node: graph / hexagon with vertices ===== -->
  <g filter="url(#softShadow)">
    <circle cx="190" cy="315" r="60" fill="#0b0d14" stroke="#818cf8" stroke-opacity="0.45"/>
  </g>
  <g stroke="#a5b4fc" stroke-width="2.4" fill="none" stroke-opacity="0.9">
    <polygon points="190,283 217,299 217,331 190,347 163,331 163,299"/>
    <path d="M190 283 L163 331 M190 283 L217 331 M163 299 L217 331 M217 299 L163 331"/>
  </g>
  <g fill="#c7d2fe">
    <circle cx="190" cy="283" r="6"/>
    <circle cx="217" cy="299" r="6"/>
    <circle cx="217" cy="331" r="6"/>
    <circle cx="190" cy="347" r="6"/>
    <circle cx="163" cy="331" r="6"/>
    <circle cx="163" cy="299" r="6"/>
  </g>

  <!-- ===== RPC node: function call ( ) ===== -->
  <g filter="url(#softShadow)">
    <circle cx="190" cy="455" r="60" fill="#140c1a" stroke="#d946ef" stroke-opacity="0.45"/>
  </g>
  <g stroke="#f0abfc" stroke-width="5" fill="none" stroke-linecap="round" stroke-opacity="0.95">
    <path d="M171 428 C 152 442, 152 468, 171 482"/>
    <path d="M209 428 C 228 442, 228 468, 209 482"/>
  </g>
  <g stroke="#f0abfc" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M180 455 H 198"/>
    <path d="M192 449 L 200 455 L 192 461"/>
  </g>

  <!-- ===== HTTP hub: concentric transport rings ===== -->
  <circle cx="600" cy="315" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="600" cy="315" r="66" fill="none" stroke="url(#line)" stroke-width="3" stroke-opacity="0.8" stroke-dasharray="6 10"/>
  <circle cx="600" cy="315" r="40" fill="#0b0d14" stroke="url(#line)" stroke-width="2.5"/>
  <circle cx="600" cy="315" r="22" fill="url(#core)" filter="url(#glow)"/>

  <!-- ===== Server / database cylinder ===== -->
  <g filter="url(#softShadow)">
    <path d="M952 268 v 94 a 52 16 0 0 0 104 0 v -94" fill="#0b0d14" stroke="#818cf8" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="1004" cy="268" rx="52" ry="16" fill="#10131c" stroke="#a5b4fc" stroke-opacity="0.6" stroke-width="2"/>
    <ellipse cx="1004" cy="300" rx="52" ry="16" fill="none" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <ellipse cx="1004" cy="332" rx="52" ry="16" fill="none" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>
  <circle cx="1004" cy="268" r="4.5" fill="#67e8f9"/>
</svg>
