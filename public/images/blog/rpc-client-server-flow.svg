<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">RPC client server flow</title>
  <desc id="desc">A precise diagram showing how an RPC call moves from a client function call through a client stub, network transport, server stub, handler, and response path.</desc>
  <defs>
    <radialGradient id="cyanGlow" cx="12%" cy="10%" r="72%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="58%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="90%" cy="86%" r="70%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.26"/>
      <stop offset="62%" stop-color="#d946ef" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a5b4fc"/>
    </marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#05060a"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#magentaGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.8"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" letter-spacing="0">
    <text x="600" y="66" fill="#f8fafc" font-size="38" font-weight="800" text-anchor="middle">RPC client-server flow</text>
    <text x="600" y="100" fill="#a5f3fc" font-size="18" font-weight="500" text-anchor="middle">a local-looking function call becomes a network request and response</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="154" width="300" height="344" rx="18" fill="url(#panel)" stroke="#22d3ee" stroke-opacity="0.36"/>
    <rect x="828" y="154" width="300" height="344" rx="18" fill="url(#panel)" stroke="#d946ef" stroke-opacity="0.36"/>
    <rect x="438" y="248" width="324" height="156" rx="18" fill="#080b14" stroke="#818cf8" stroke-opacity="0.42"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" letter-spacing="0">
    <text x="222" y="198" fill="#67e8f9" font-size="24" font-weight="800" text-anchor="middle">CLIENT</text>
    <text x="978" y="198" fill="#f0abfc" font-size="24" font-weight="800" text-anchor="middle">SERVER</text>
    <text x="600" y="292" fill="#c7d2fe" font-size="21" font-weight="800" text-anchor="middle">TRANSPORT</text>
    <text x="600" y="322" fill="#e2e8f0" font-size="17" font-weight="600" text-anchor="middle">HTTP/2, TCP or another wire protocol</text>
  </g>

  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" letter-spacing="0">
    <rect x="116" y="234" width="212" height="54" rx="12" fill="#0f172a" stroke="#67e8f9" stroke-opacity="0.44"/>
    <text x="222" y="267" fill="#e0f2fe" font-size="17" font-weight="700" text-anchor="middle">order.create()</text>

    <rect x="116" y="340" width="212" height="74" rx="12" fill="#0f172a" stroke="#67e8f9" stroke-opacity="0.44"/>
    <text x="222" y="368" fill="#e0f2fe" font-size="16" font-weight="700" text-anchor="middle">CLIENT STUB</text>
    <text x="222" y="393" fill="#bae6fd" font-size="14" font-weight="500" text-anchor="middle">serialize args</text>

    <rect x="872" y="234" width="212" height="74" rx="12" fill="#180d24" stroke="#f0abfc" stroke-opacity="0.48"/>
    <text x="978" y="262" fill="#fae8ff" font-size="16" font-weight="700" text-anchor="middle">SERVER STUB</text>
    <text x="978" y="287" fill="#f5d0fe" font-size="14" font-weight="500" text-anchor="middle">decode message</text>

    <rect x="872" y="360" width="212" height="54" rx="12" fill="#180d24" stroke="#f0abfc" stroke-opacity="0.48"/>
    <text x="978" y="393" fill="#fae8ff" font-size="17" font-weight="700" text-anchor="middle">handler()</text>
  </g>

  <g fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#glow)">
    <path d="M222 290 V334"/>
    <path d="M330 377 C390 377 408 326 430 326"/>
    <path d="M762 326 C800 326 812 271 864 271"/>
    <path d="M978 310 V354"/>
    <path d="M872 401 C812 458 754 458 690 418"/>
    <path d="M510 418 C430 462 354 424 330 400"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" letter-spacing="0" font-size="15" font-weight="700">
    <circle cx="222" cy="312" r="15" fill="#22d3ee"/>
    <text x="222" y="318" fill="#041014" text-anchor="middle">1</text>
    <circle cx="386" cy="350" r="15" fill="#67e8f9"/>
    <text x="386" y="356" fill="#041014" text-anchor="middle">2</text>
    <circle cx="812" cy="298" r="15" fill="#a5b4fc"/>
    <text x="812" y="304" fill="#05060a" text-anchor="middle">3</text>
    <circle cx="978" cy="334" r="15" fill="#f0abfc"/>
    <text x="978" y="340" fill="#14051a" text-anchor="middle">4</text>
    <circle cx="794" cy="438" r="15" fill="#d946ef"/>
    <text x="794" y="444" fill="#fff7ed" text-anchor="middle">5</text>
    <circle cx="392" cy="438" r="15" fill="#818cf8"/>
    <text x="392" y="444" fill="#05060a" text-anchor="middle">6</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" letter-spacing="0" font-size="14" font-weight="600" fill="#cbd5e1">
    <text x="600" y="361" text-anchor="middle">method name + typed arguments</text>
    <text x="600" y="382" text-anchor="middle">binary or JSON payload, depending on the framework</text>
    <text x="600" y="483" text-anchor="middle">return value or error travels back through the same contract</text>
  </g>
</svg>
